[project]
name = "harbor-acp-mini-agent"
version = "0.1.0"
description = "Minimal ACP coding agent for Harbor source-backed agent examples"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "agent-client-protocol==0.12.0",
]

[project.scripts]
harbor-acp-mini-agent = "harbor_acp_mini_agent.agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_acp_mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
